services:

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: relay_backend
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app/backend:/app
      DATABASE_URL: postgresql+psycopg2://relay:relay_password@postgres:5432/relay
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    container_name: relay_postgres
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_password
      POSTGRES_DB: relay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: relay_redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus
    container_name: relay_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: relay_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data: